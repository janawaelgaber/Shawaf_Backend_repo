services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shawaf
      POSTGRES_USER: shawaf_local
      POSTGRES_PASSWORD: shawaf_local
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-schemas.sql

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: shawaf_local
      MINIO_ROOT_PASSWORD: shawaf_local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-bucket:
    image: minio/mc
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 shawaf_local shawaf_local; do sleep 1; done
        mc mb -p local/shawaf-media

volumes:
  postgres-data:
  minio-data:
