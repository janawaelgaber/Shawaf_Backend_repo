[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shawaf-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "celery[redis]>=5.4",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic>=2.0",
  "email-validator>=2.0",
  "jsonschema[format]>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "datamodel-code-generator==0.99.0",
]

[tool.setuptools.packages.find]
include = ["ai*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["ai/tests"]
